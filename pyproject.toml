[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "altai-agent"
version = "0.2.3"
description = "Local project completion operating system for Claude Code and Codex"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
altai = "altai.cli:main"

# Explicit package list. Without this, setuptools flat-layout auto-discovery
# aborts the build as soon as any second top-level directory exists
# ("Multiple top-level packages discovered in a flat-layout").
[tool.setuptools]
packages = ["altai", "altai.intelligence"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
